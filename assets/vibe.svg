<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120" role="img" aria-labelledby="t d">
  <title id="t">Vibe with me</title>
  <desc id="d">A spinning record and a bouncing equalizer above my recently played tracks on Last.fm.</desc>
  <defs>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#ff7a90"/>
    </linearGradient>
  </defs>
  <style>
    .disc { transform-box: fill-box; transform-origin: center; animation: spin 3.2s linear infinite; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite alternate; }
    .note { animation: float 3s ease-in-out infinite; opacity: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes eq { 0% { transform: scaleY(.2); } 100% { transform: scaleY(1); } }
    @keyframes float { 0% { transform: translate(0, 6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(10px, -26px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .disc, .bar, .note { animation: none; } .note { opacity: 1; } }
    text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect x=".5" y=".5" width="499" height="119" rx="12" fill="#080c18" stroke="#1e2a44"/>

  <!-- record -->
  <g class="disc">
    <circle cx="60" cy="60" r="38" fill="#0f1424" stroke="#26345a"/>
    <circle cx="60" cy="60" r="31" fill="none" stroke="#1a2238"/>
    <circle cx="60" cy="60" r="25" fill="none" stroke="#1a2238"/>
    <circle cx="60" cy="60" r="19" fill="none" stroke="#1a2238"/>
    <path d="M60 22 A38 38 0 0 1 92 40" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <circle cx="60" cy="60" r="12" fill="#ff7a90"/>
    <circle cx="60" cy="60" r="2.5" fill="#080c18"/>
  </g>

  <!-- notes drifting off the record -->
  <text class="note" x="96" y="40" fill="#fcca1b" font-size="16">♪</text>
  <text class="note" x="104" y="56" fill="#5eead4" font-size="13" style="animation-delay:1s">♫</text>
  <text class="note" x="92" y="70" fill="#c084fc" font-size="14" style="animation-delay:2s">♪</text>

  <text x="128" y="54" font-size="22" font-weight="700" letter-spacing="3" fill="url(#title)">VIBE WITH ME</text>
  <text x="128" y="78" font-size="11.5" fill="#93a6c4">on loop lately · live from Last.fm</text>

  <!-- equalizer -->
  <g>
    <rect class="bar" x="380" y="30" width="7" height="60" rx="2" fill="#779dff" style="animation-delay:-.1s"/>
    <rect class="bar" x="391" y="30" width="7" height="60" rx="2" fill="#5eead4" style="animation-delay:-.5s;animation-duration:.8s"/>
    <rect class="bar" x="402" y="30" width="7" height="60" rx="2" fill="#8ed345" style="animation-delay:-.3s;animation-duration:1.3s"/>
    <rect class="bar" x="413" y="30" width="7" height="60" rx="2" fill="#fcca1b" style="animation-delay:-.8s;animation-duration:.9s"/>
    <rect class="bar" x="424" y="30" width="7" height="60" rx="2" fill="#ff7a90" style="animation-delay:-.2s;animation-duration:1.2s"/>
    <rect class="bar" x="435" y="30" width="7" height="60" rx="2" fill="#c084fc" style="animation-delay:-.6s;animation-duration:.7s"/>
    <rect class="bar" x="446" y="30" width="7" height="60" rx="2" fill="#779dff" style="animation-delay:-.4s;animation-duration:1s"/>
    <rect class="bar" x="457" y="30" width="7" height="60" rx="2" fill="#5eead4" style="animation-delay:-.9s;animation-duration:1.4s"/>
    <rect class="bar" x="468" y="30" width="7" height="60" rx="2" fill="#8ed345" style="animation-delay:-.15s;animation-duration:.85s"/>
  </g>
</svg>
