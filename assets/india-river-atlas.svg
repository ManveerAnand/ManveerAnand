  </g>
  <circle cx="30" cy="121" r="5" fill="#f1e05a"/>
  <text x="42" y="125" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="12">JavaScript · Three.js · WebGL</text>
  <text x="25" y="150" fill="#b591da" font-family="Segoe UI,Arial,sans-serif" font-size="11">IN DEVELOPMENT</text>
  <text x="141" y="150" fill="#6e7681" font-family="Segoe UI,Arial,sans-serif" font-size="11">· Private source</text>
