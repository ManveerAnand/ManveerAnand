<svg xmlns="http://www.w3.org/2000/svg" width="420" height="170" viewBox="0 0 420 170" role="img" aria-labelledby="title desc">
  <title id="title">India River Atlas</title>
  <desc id="desc">A 3D journey through India's rivers. JavaScript, Three.js and WebGL. In development; source repository is private.</desc>
  <rect width="420" height="170" rx="8" fill="#0d1117"/>
  <g fill="none" stroke="#79e7f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 26c7-5 13 5 20 0m-20 7c7-5 13 5 20 0m-20 7c7-5 13 5 20 0"/>
  </g>
  <text x="57" y="38" fill="#79e7f1" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">India River Atlas</text>
  <text x="25" y="69" fill="#b8bfcc" font-family="Segoe UI,Arial,sans-serif" font-size="13">A 3D journey from headwaters to living ghats.</text>
  <text x="25" y="90" fill="#b8bfcc" font-family="Segoe UI,Arial,sans-serif" font-size="13">19 river routes · 8 Ganga miniatures</text>
  <g fill="none" stroke-linecap="round">
