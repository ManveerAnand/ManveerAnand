# Play a move in the README chess game when someone opens a "chess|<code>|<move>" issue.
name: Chess

on:
  issues:
    types: [opened]

# One move at a time, so two issues can't race on the same board.
concurrency: chess

jobs:
  move:
    if: startsWith(github.event.issue.title, 'chess|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install chess==1.11.2

      # The title is untrusted: it only reaches Python through env, never a shell line.
      - name: Play the move
        run: python .github/scripts/chess_move.py
        env:
          TITLE: ${{ github.event.issue.title }}
          AUTHOR: ${{ github.event.issue.user.login }}

      - name: Commit the board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chess README.md
          if ! git diff --cached --quiet; then
            git commit -m "Chess: move by $AUTHOR"
            git pull --rebase
            git push
          fi
        env:
          AUTHOR: ${{ github.event.issue.user.login }}

      - name: Reply and close the issue
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$(cat "$RUNNER_TEMP/chess-reply.md")"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
