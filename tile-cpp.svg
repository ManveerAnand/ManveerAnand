<svg xmlns="http://www.w3.org/2000/svg" width="120" height="112" viewBox="0 0 120 112" role="img">
<title>C++: 5% of my code, ↗ VoiceLink</title>
<style>
.glow{animation:glow 3s ease-in-out 1.05s infinite}
.logo{animation:bob 3s ease-in-out 1.05s infinite}
.fill{transform-box:fill-box;transform-origin:left;animation:grow 1.4s ease-out 1.05s both}
@keyframes glow{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.glow,.logo,.fill{animation:none}}
text{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;text-anchor:middle}
</style>
<rect x="1" y="1" width="118" height="110" rx="12" fill="#0f1424"/>
<rect class="glow" x="1" y="1" width="118" height="110" rx="12" fill="none" stroke="#c084fc" stroke-width="2"/>
<g class="logo"><image href="data:image/svg+xml;base64," x="40" y="10" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
<text x="60" y="66" font-size="12" font-weight="700" fill="#edf4ff">C++</text>
<text x="60" y="80" font-size="9" fill="#c084fc">5% of my code</text>
<rect x="12" y="86" width="96" height="5" rx="2.5" fill="#1a2238"/><rect class="fill" x="12" y="86" width="4.8" height="5" rx="2.5" fill="#c084fc"/>
<text x="60" y="104" font-size="8.5" fill="#93a6c4">↗ VoiceLink</text>
</svg>